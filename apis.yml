aid: qubole
name: Qubole
description: 'Qubole is a cloud-native data lake platform (now part of Idera) that lets
  teams run multiple open-source data-processing engines - Apache Spark, Presto, Hive,
  Hadoop, and Airflow - together in a single, cost-optimized, self-managing environment
  across AWS, Microsoft Azure, Google Cloud Platform, and Oracle Cloud Infrastructure.
  The Qubole Data Service (QDS) automates cluster provisioning, autoscaling, and spot/preemptible
  instance management to reduce data-lake costs, and exposes a comprehensive REST API for
  submitting Hive/Presto/Spark/Hadoop commands, managing clusters, scheduling jobs, running
  notebooks and dashboards, and administering accounts, users, groups, and roles. First-party
  SDKs (Python qds-sdk, Java, and Ruby), the qds.py command-line tool, and the afctl Airflow
  CLI wrap the API. This profile was surfaced as a VC-portfolio lead and enriched by the API
  Evangelist pipeline against Qubole''s live public documentation and package registries.'
