apis:
- name: Qubole Data Service REST API
  description: 'The Qubole Data Service (QDS) REST API for submitting and managing data
    commands (Hive, Presto, Spark, Hadoop, Pig, shell, DB import/export, notebook), managing
    compute clusters, scheduling recurring jobs, running notebooks and dashboards, and
    administering accounts, users, groups, and roles. Authenticated with a per-user Qubole
    API token sent in the X-AUTH-TOKEN header; versioned by URI path (v1.2, v1.3, v2).'
